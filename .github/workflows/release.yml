# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Release Maven Package
on:
  push:
    tags:
      - 'v*'

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_USER: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.ORG_MAVEN_PUBLISH_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Prepare REVISION
        run: |
          REF_NAME="${{ github.ref_name }}"          
          echo "REVISION=1.${REF_NAME#v}" >> $GITHUB_ENV

      - name: Build And Test
        run: mvn --batch-mode verify -Drevision=${{ env.REVISION }}

      - name: Deploy
        run: mvn --batch-mode deploy -Drevision=${{ env.REVISION }}


      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "Lib: \`${{ github.event.repository.name }}:${{ env.REVISION }}\`"
